<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identity Card</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</head>
 <style>
        body {
            background-color: #f0f2f5;
            font-family: Arial, sans-serif;
        }

        .id-card {
            width: 350px;
            border-radius: 15px;
            overflow: hidden;
            background-color: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .card-header {
            background-color: #8f1eb5;
            color: white;
            padding: 20px;
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
        }

        .card-body {
            padding: 25px;
        }

        .label {
            font-weight: bold;
            color: #8f1eb5;
        }

        .card-footer {
            background-color: #8f1eb5;
            color: white;
            padding: 12px;
        }
    </style>
<body>
    <div class="container d-flex justify-content-center align-items-center min-vh-100">

        <div class="card id-card text-center">

            <!-- Card Header -->
            <div class="card-header">
                <h4 class="mb-1"> Deloitee</h4>
                <p class="mb-0">EMPLOYEE IDENTITY CARD</p>
            </div>

            <!-- Card Body -->
            <div class="card-body">

                <img
                    src="nivi image.jpeg"
                    alt="Profile Photo"
                    class="profile-img mb-3"
                >

                <h4 class="fw-bold">Nivetha Ananth</h4>
                <p class="text-muted">Full Stack Developer</p>

                <hr>

                <div class="text-start">
                    <p>
                        <span class="label">Employee ID:</span>
                        EMP001
                    </p>

                    <p>
                        <span class="label">Department:</span>
                        Software Development
                    </p>

                    <p>
                        <span class="label">Email:</span>
                        nivi02@gmail.com
                    </p>
                </div>

            </div>

            <!-- Card Footer -->
            <div class="card-footer">
                <p class="mb-0">Authorized Employee</p>
            </div>

        </div>

    </div>

</body>
</html>
</body>
</html>
